name: Publish verified backup and website
on:
  push:
    branches: [main]
    paths: [delivery/ready.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: complete-v2-release
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Reassemble Git backup, verify all files and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-from-git.py delivery/ready.json
  build:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Assemble website with verified release media
        run: python3 scripts/build-pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public film website
        id: deployment
        uses: actions/deploy-pages@v4
